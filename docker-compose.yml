services:
  db:
    image: postgres:16-alpine
    container_name: screenplay-postgres
    restart: always
    environment:
      POSTGRES_DB: saas_backend
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: saas-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/saas_backend
      SPRING_DATASOURCE_USERNAME: saas_user
      SPRING_DATASOURCE_PASSWORD: adminpassword

volumes:
  db_data:
