# =========================
# SaaS Backend Starter - Demo Config
# ⚠️ For demo/portfolio only! Real secrets must be set as environment variables.
# =========================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/saas_backend}
    username: ${SPRING_DATASOURCE_USERNAME:saas_user}
    password: ${SPRING_DATASOURCE_PASSWORD:adminpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      INDENT_OUTPUT: true

jwt:
  secret: ${JWT_SECRET:super-secret-key-that-is-very-long-and-random-for-jwt-signing-123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-token-duration-ms: ${JWT_REFRESH_TOKEN_DURATION_MS:604800000}

# Credentials used only by the Agent Gateway when it calls the internal
# screenplay adapters.  This is deliberately separate from browser JWTs.
agent:
  execution:
    # Set AGENT_EXECUTION_SECRET in every non-demo deployment; do not reuse JWT_SECRET.
    secret: ${AGENT_EXECUTION_SECRET:agent-execution-demo-secret-must-be-replaced-in-production-123456789}
    ttl-seconds: ${AGENT_EXECUTION_TOKEN_TTL_SECONDS:600}
  gateway:
    url: ${AGENT_GATEWAY_URL:http://127.0.0.1:3001}
    token: ${AGENT_GATEWAY_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
      base-path: /actuator
  endpoint:
    health:
      show-details: "when_authorized"
  health:
    probes:
      enabled: true
